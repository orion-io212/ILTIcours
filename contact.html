<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Contact | ArchiCours</title>
  
  <!-- الخطوط المستخدمة -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Mono:wght@400;600&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- ملف الأنماط -->
  <link rel="stylesheet" href="style.css">
</head>
<body data-root="" data-nav="contact">

  <!-- المحتوى الرئيسي -->
  <main>
    <!-- رأس الصفحة (Page Header) -->
    <div class="ph">
      <h1>Contact</h1>
      <p class="lead">Une question, une erreur repérée, une idée de chapitre ? Écrivez-nous.</p>
    </div>

    <!-- قسم نموذج الاتصال -->
    <section style="padding-top: 8px;">
      <form class="form" id="cform">
        <label>
          Votre nom
          <input name="n" autocomplete="name">
        </label>
        
        <label>
          Sujet
          <input name="s">
        </label>
        
        <label>
          Message
          <textarea name="m" required></textarea>
        </label>
        
        <button class="btn" type="submit">Envoyer par e-mail</button>
        
        <p style="margin: 0; color: var(--mu); font-size: 15px;">
          Le bouton ouvre votre application de messagerie. Remplacez l’adresse dans js/site.js.
        </p>
      </form>
    </section>
  </main>

  <!-- ملفات الجافا سكريبت -->
  <script src="js/site.js"></script>
  <script src="js/common.js"></script>

</body>
</html>
